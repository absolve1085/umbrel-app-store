version: "3.7"

services:
  app_proxy:
    environment:
      APP_HOST: electrs-intel_web_1
      APP_PORT: 8877

  web:
    image: python:3.12-alpine
    restart: unless-stopped
    command: python /app/dashboard.py --db /data/snoop.db --listen 0.0.0.0:8877
    environment:
      APP_PASSWORD: ${APP_PASSWORD:-}
    volumes:
      - ${APP_DATA_DIR}/data:/data
      - ./app:/app:ro

  monitor:
    image: python:3.12-alpine
    restart: unless-stopped
    entrypoint: /bin/sh
    command: /app/monitor-app.sh
    environment:
      ELECTRUM_SERVER: ${ELECTRUM_SERVER:-auto}
      ELECTRUM_PORT: ${ELECTRUM_PORT:-50001}
      APP_DATA_DIR: ${APP_DATA_DIR}
    volumes:
      - ${APP_DATA_DIR}/data:/data
      - ./app:/app:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
