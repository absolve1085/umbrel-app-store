version: "3.7"
services:
  sniffer:
    build: ./sniffer
    image: electrs-intel-sniffer:0.2.0
    restart: unless-stopped
    network_mode: host
    cap_add:
      - NET_RAW
      - NET_ADMIN
    command: -i any -s0 -U -W 30 -C 100 -w /data/capture.pcap tcp port ${ELECTRUM_PORT:-50001}
    volumes:
      - ${APP_DATA_DIR}/data:/data
  monitor:
    image: python:3.12-alpine
    restart: unless-stopped
    network_mode: host
    entrypoint: /bin/sh
    command: /app/monitor-app.sh
    environment:
      ELECTRUM_SERVER: ${ELECTRUM_SERVER:-auto}
      ELECTRUM_PORT: ${ELECTRUM_PORT:-50001}
    volumes:
      - ${APP_DATA_DIR}/data:/data
      - ./app:/app:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
  intel:
    image: python:3.12-alpine
    restart: unless-stopped
    command: python /app/dashboard.py --db /data/snoop.db --listen 0.0.0.0:8877
    environment:
      APP_PASSWORD: ${APP_PASSWORD:-}
    ports:
      - "${APP_PORT:-8877}:8877"
    volumes:
      - ${APP_DATA_DIR}/data:/data
      - ./app:/app:ro
