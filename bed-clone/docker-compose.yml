version: "3.7"

services:
  app_proxy:
    environment:
      APP_HOST: ${APP_SEMILLABITCOIN_BED_IP}
      APP_PORT: ${APP_SEMILLABITCOIN_BED_PORT}

  app:
    image: ghcr.io/semillabitcoin/descriptor-cifrado:0.3.0@sha256:1ded4e601c079b3c2d9da8c99461feef542f2f464216a8d7a670288fb8e2c7ae
    init: true
    restart: on-failure
    stop_grace_period: 1m
    volumes:
      - ${APP_DATA_DIR}/data/encrypted:/data/encrypted
    networks:
      default:
        ipv4_address: ${APP_SEMILLABITCOIN_BED_IP}
