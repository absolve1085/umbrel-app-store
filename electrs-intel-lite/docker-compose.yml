version: "3.7"

services:
  app_proxy:
    environment:
      APP_HOST: electrs-intel-lite_web_1
      APP_PORT: 8877

  web:
    image: python:3.12-alpine
    restart: unless-stopped
    command: python /app/dashboard.py --db /data/snoop.db --listen 0.0.0.0:8877
    volumes:
      - ${APP_DATA_DIR}/data:/data
      - ./app:/app:ro
